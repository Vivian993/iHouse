<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的數位小屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF0EE;
  --paper:#FFFAF8;
  --pink:#F0AAB4;
  --pink-deep:#E08B98;
  --mint:#A8C3AE;
  --mint-deep:#84A88C;
  --yellow:#E8C48B;
  --red:#D6707A;
  --blue:#A6BDD4;
  --blue-deep:#7FA0BF;
  --ink:#5A4A4C;
  --ink-soft:#9C8A8C;
  --line:#F0DFE0;
  --header:#E0728A;
  --shadow: 0 8px 24px rgba(90,74,76,0.10);
  --shadow-sm: 0 3px 10px rgba(90,74,76,0.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
.hidden{display:none !important;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Noto Sans TC',sans-serif;
  font-size:16px;
  background:
    radial-gradient(circle at 15% 8%, rgba(211,175,113,0.16), transparent 40%),
    radial-gradient(circle at 85% 5%, rgba(147,168,140,0.14), transparent 40%),
    var(--cream);
  color:var(--ink);
  overscroll-behavior:none;
}
.title-font{font-family:'ZCOOL KuaiLe',cursive; color:var(--header); font-size:23px; letter-spacing:.5px; text-shadow:0 1px 0 rgba(255,255,255,0.6);}
#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  padding-bottom:82px;
}

/* ---------- top bar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 18px 10px;
}
.topbar h1{
  font-size:25px; margin:0; font-weight:700; letter-spacing:.5px;
}
.topbar .sub{font-size:13.5px; color:var(--ink-soft); margin-top:2px;}
.back-btn{
  border:none; background:var(--paper); box-shadow:var(--shadow-sm);
  width:38px; height:38px; border-radius:14px; font-size:18px;
  display:flex; align-items:center; justify-content:center; color:var(--ink);
}

.screen{display:none; padding:0 18px 18px;}
.screen.active{display:block;}

/* ---------- home hero: 撕頁桌曆卡片 ---------- */
.hero{
  position:relative;
  background:var(--paper);
  border-radius:26px;
  box-shadow:var(--shadow);
  padding:22px 20px 20px;
  margin:6px 0 16px;
  overflow:hidden;
}
.hero::before{
  content:"";
  position:absolute; top:0; left:24px; right:24px; height:14px;
  background:repeating-linear-gradient(90deg, var(--pink) 0 14px, transparent 14px 22px);
  border-radius:0 0 8px 8px;
  opacity:.55;
}
.hero-ring{
  position:absolute; top:6px; display:flex; gap:16px; left:50%; transform:translateX(-50%);
}
.hero-ring span{width:9px;height:9px;border-radius:50%;background:var(--paper); border:2px solid var(--pink-deep); display:block;}
.hero-top{display:flex; justify-content:space-between; align-items:flex-start; margin-top:10px;}
.hero-date-big{font-size:44px; font-weight:900; line-height:1; font-family:'ZCOOL KuaiLe',cursive; color:var(--pink-deep);}
.hero-date-sub{font-size:14.5px; color:var(--ink-soft); margin-top:6px;}
.hero-lunar{
  text-align:right; font-size:14.5px; color:var(--ink);
}
.hero-lunar .big{font-size:16px; font-weight:700;}
.hero-lunar .red{color:var(--red); font-weight:700;}
.hero-festival{
  margin-top:10px; font-size:13px; background:linear-gradient(90deg,#FFE9C7,#FFF3DC);
  display:inline-block; padding:5px 12px; border-radius:999px; color:#8a5a12;
}
.hero-todo-title{display:flex; align-items:center; justify-content:space-between; margin-top:14px;}
.hero-todo-title h3{font-size:15.5px; margin:0; color:var(--ink-soft); font-weight:700;}
.hero-todo-title .count{font-size:13px; color:var(--mint-deep); font-weight:700;}
.todo-quick-add{display:flex; gap:8px; margin-top:10px;}
.todo-quick-add input{
  flex:1; border:1.5px solid var(--line); border-radius:14px; padding:11px 12px; font-size:15.5px;
  font-family:inherit; background:#fff;
}
.todo-quick-add button{
  border:none; background:var(--pink); color:#fff; border-radius:14px; width:44px; font-size:18px; font-weight:700;
}
.todo-list{margin-top:10px; display:flex; flex-direction:column; gap:8px;}
.todo-item{
  display:flex; align-items:center; gap:10px; background:#fff; border-radius:14px; padding:9px 12px;
  box-shadow:var(--shadow-sm); font-size:15.5px;
}
.todo-item .chk{
  width:22px;height:22px;border-radius:50%; border:2px solid var(--mint-deep); flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px;
}
.todo-item.done .chk{background:var(--mint-deep);}
.todo-item.done .txt{text-decoration:line-through; color:var(--ink-soft);}
.todo-item .txt{flex:1; word-break:break-all;}
.todo-item .del{color:var(--ink-soft); background:none; border:none; font-size:16px; padding:2px 4px;}
.empty-hint{font-size:14.5px; color:var(--ink-soft); text-align:center; padding:14px 0;}

/* ---------- app grid ---------- */
.grid-title{font-size:15.5px; font-weight:700; color:var(--ink-soft); margin:18px 4px 10px;}
.app-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
.app-icon-wrap{position:relative;}
.app-icon{
  display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none;
  font-family:inherit; color:var(--ink); width:100%;
}
.app-icon .ic{
  width:58px; height:58px; border-radius:20px; display:flex; align-items:center; justify-content:center;
  font-size:26px; box-shadow:var(--shadow-sm); background-color:#fff; overflow:hidden; color:var(--ink);
}
.app-icon span{font-size:11.5px; font-weight:500;}
.ic-edit-btn{
  position:absolute; top:-2px; right:8px; width:20px; height:20px; border-radius:50%;
  background:#fff; border:1px solid var(--line); font-size:10.5px; color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center; padding:0; box-shadow:var(--shadow-sm);
}
.grid-hint{font-size:12px; color:var(--ink-soft); text-align:center; margin-top:14px;}
.ic-cal{background-color:#F6DDE1;}
.ic-calc{background-color:#DCEADD;}
.ic-kid{background-color:#F5E6C8;}
.ic-me{background-color:#E5DCE8;}
.ic-life{background-color:#DCE6EE;}
.ic-fav{background-color:#F6E2D3;}
.ic-phone{background-color:#DCE6EE;}
.ic-search{background-color:#F0E8E6;}
.ic-cards{background-color:#F6DCE0;}
.ic-alltodos{background-color:#E3EBDA;}

/* ---------- calendar ---------- */
.cal-nav{display:flex; align-items:center; justify-content:space-between; margin:8px 0 14px;}
.cal-nav button{border:none; background:var(--paper); box-shadow:var(--shadow-sm); width:36px; height:36px; border-radius:12px; font-size:16px;}
.cal-nav .ym{font-size:18px; font-weight:700;}
.week-row{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:6px;}
.day-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.day-cell{
  aspect-ratio:1/1.08; background:#fff; border-radius:12px; box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative;
  font-size:11px; padding:2px; gap:1px;
}
.day-cell.pad{box-shadow:none; background:transparent;}
.day-cell .sd{font-size:15.5px; font-weight:700;}
.day-cell .ld{font-size:10.5px; color:var(--ink-soft);}
.day-cell.red .sd, .day-cell.red .ld{color:var(--red);}
.day-cell.today{border:2px solid var(--pink-deep);}
.day-cell.has-todo::after{
  content:""; position:absolute; bottom:4px; width:4px; height:4px; border-radius:50%; background:var(--mint-deep);
}
.day-cell .fest{font-size:9px; margin-top:1px;}
.legend{display:flex; gap:14px; margin-top:12px; font-size:11.5px; color:var(--ink-soft); flex-wrap:wrap;}
.legend span{display:inline-flex; align-items:center; gap:4px;}
.legend i{width:8px;height:8px;border-radius:50%; display:inline-block;}

/* day detail modal */
.modal-mask{position:fixed; inset:0; background:rgba(75,64,56,0.35); display:none; align-items:flex-end; justify-content:center; z-index:50;}
.modal-mask.show{display:flex;}
.modal-box{
  background:var(--paper); width:100%; max-width:480px; border-radius:24px 24px 0 0; padding:20px 20px 26px;
  max-height:85vh; overflow-y:auto;
}
.modal-box h2{margin:0 0 4px; font-size:20px;}
.modal-box .modal-sub{font-size:14.5px; color:var(--ink-soft); margin-bottom:14px;}
.modal-close{float:right; border:none; background:var(--cream); width:32px;height:32px;border-radius:10px; font-size:16px;}

/* ---------- 六十甲子籤 ---------- */
.qian-mini{
  margin-top:16px; display:flex; align-items:center; gap:12px; background:linear-gradient(160deg,#F3E3DE,var(--paper));
  border:1.5px solid rgba(182,96,79,0.3); border-radius:18px; padding:12px 14px; box-shadow:var(--shadow-sm);
}
.qian-mini-tube{width:44px; height:44px; display:flex; align-items:center; justify-content:center;}
.qian-mini-tube img{width:100%; height:100%; object-fit:contain;}
.qian-mini-title{font-family:'ZCOOL KuaiLe',cursive; font-size:16px; color:var(--red);}
.qian-mini-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.qian-modal-box{text-align:center;}
.qian-tube-wrap{display:flex; justify-content:center; margin-top:6px;}
.qian-tube-big{height:170px; width:auto; cursor:pointer; transition:transform .15s; display:block; margin:0 auto; animation:tubeEnter .5s ease-out;}
.qian-tube-big.shaking{animation:qianShake .9s ease-in-out;}
@keyframes tubeEnter{
  0%{ transform:translateY(46px); opacity:0; }
  100%{ transform:translateY(0); opacity:1; }
}
@keyframes qianShake{
  0%,100%{transform:rotate(0deg);} 10%{transform:rotate(-9deg);} 20%{transform:rotate(8deg);}
  30%{transform:rotate(-9deg);} 40%{transform:rotate(8deg);} 50%{transform:rotate(-7deg);}
  60%{transform:rotate(6deg);} 70%{transform:rotate(-4deg);} 80%{transform:rotate(3deg);} 90%{transform:rotate(-2deg);}
}
.qian-hint{font-size:13.5px; color:var(--ink-soft); margin-top:12px;}
.qian-drawn-num{font-family:'ZCOOL KuaiLe',cursive; font-size:24px; color:var(--red); margin-top:6px;}
.jiao-pair{display:flex; gap:26px; justify-content:center; align-items:flex-end; margin:20px 0 8px;}
.jiao-block{
  height:80px; width:auto; filter:drop-shadow(0 3px 4px rgba(75,64,56,0.25)); transition:transform .2s;
}
.jiao-block.tossing{animation:jiaoToss .9s ease-in-out;}
@keyframes jiaoToss{
  0%{transform:translateY(0) rotate(0deg);}
  30%{transform:translateY(-50px) rotate(200deg);}
  60%{transform:translateY(-14px) rotate(380deg);}
  100%{transform:translateY(0) rotate(400deg);}
}
.jiao-result{font-size:14.5px; font-weight:700; color:var(--red); min-height:20px; margin-bottom:6px;}
.qian-result-card{
  background:linear-gradient(180deg,var(--paper),#F3E7D8); border:2px solid var(--red);
  border-radius:18px; padding:20px 18px; text-align:left; margin-top:6px;
}
.qian-result-card::before{ content:"🧧"; font-size:22px; float:right; }
.qr-num{font-size:12.5px; color:var(--ink-soft); letter-spacing:.1em;}
.qr-level{display:inline-block; margin-top:4px; font-size:12.5px; font-weight:700; color:#fff; background:var(--red); padding:3px 12px; border-radius:999px;}
.qr-verse{font-family:'ZCOOL KuaiLe',cursive; font-size:19px; line-height:2; color:var(--ink); margin-top:14px;
  border-top:1px dashed rgba(182,96,79,0.4); border-bottom:1px dashed rgba(182,96,79,0.4); padding:12px 2px;}
.qr-wx{font-size:12px; color:var(--ink-soft); margin-top:6px;}
.qr-summary{font-size:14.5px; line-height:1.7; margin-top:12px;}
.qr-summary b{color:var(--red);}
.qr-advice{font-size:13.5px; line-height:1.7; color:var(--ink-soft); background:rgba(182,96,79,0.07);
  border-left:3px solid var(--yellow); padding:10px 12px; border-radius:2px; margin-top:8px;}

/* ---------- calculator ---------- */
.calc-display{
  background:var(--ink); color:#fff; border-radius:20px; padding:26px 20px; text-align:right;
  font-size:40px; font-weight:700; margin-bottom:14px; word-break:break-all; box-shadow:var(--shadow);
}
.calc-display .expr{font-size:14px; color:#c9c2d6; min-height:18px;}
.calc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.calc-btn{
  border:none; border-radius:16px; padding:18px 0; font-size:19px; font-weight:700; background:#fff;
  box-shadow:var(--shadow-sm); color:var(--ink);
}
.calc-btn.op{background:var(--pink); color:#fff;}
.calc-btn.fn{background:var(--cream); color:var(--pink-deep);}
.calc-btn.eq{background:var(--mint-deep); color:#fff;}

/* ---------- more / portals ---------- */
.tape-label{
  display:inline-block; font-size:13.5px; color:#8a6d3b; background:linear-gradient(90deg,#FFE9C7,#FFDFAE);
  padding:5px 14px; border-radius:3px; margin:2px 0 14px; transform:rotate(-1deg); box-shadow:var(--shadow-sm);
}
.img-picker{
  flex:0 0 42px; height:42px; border-radius:12px; border:1.5px dashed var(--line); background:#fff;
  font-size:18px; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:0;
}
.img-picker img{width:100%; height:100%; object-fit:cover;}
.list-card{ background:var(--paper); border-radius:18px; box-shadow:var(--shadow-sm); overflow:hidden; }
.list-row{
  display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px dashed var(--line);
}
.list-row:last-child{ border-bottom:none; }
.list-row .row-icon{
  width:34px; height:34px; border-radius:50%; background:var(--cream); flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; font-size:17px; overflow:hidden;
}
.list-row .row-icon img{width:100%; height:100%; object-fit:cover;}
.list-row .row-text{flex:1; min-width:0;}
.list-row .row-title{font-size:16.5px; font-weight:600;}
.list-row .row-sub{font-size:12.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.list-row .row-icon.has-photo{
  width:56px; height:56px; border-radius:10px; background:#fff; padding:3px;
  box-shadow:0 2px 6px rgba(75,64,56,0.18); transform:rotate(-1.5deg);
}
.list-row .row-icon.has-photo img{ border-radius:7px; }
.row-note{font-size:12.5px; color:var(--ink-soft); margin-top:2px; line-height:1.4; white-space:normal;}
.list-row .row-del{border:none; background:none; color:var(--ink-soft); font-size:15px; padding:4px 2px; flex:0 0 auto;}
/* ---------- 今日黃曆 ---------- */
.almanac-card{
  background:linear-gradient(180deg,var(--paper),var(--cream));
  border:2px solid var(--pink-deep); border-radius:22px; padding:24px 22px 20px; margin-top:10px;
  box-shadow:var(--shadow); position:relative;
}
.almanac-card::before{
  content:""; position:absolute; inset:6px; border:1px solid rgba(185,117,88,0.35); border-radius:15px; pointer-events:none;
}
.am-top{text-align:center;}
.am-lunar-big{font-family:'ZCOOL KuaiLe',cursive; font-size:30px; color:var(--pink-deep);}
.am-solar{font-size:14.5px; color:var(--ink-soft); margin-top:4px;}
.am-ganzhi{
  text-align:center; margin-top:14px; font-size:16px; font-weight:700; color:var(--ink);
  background:rgba(185,117,88,0.08); border-radius:12px; padding:8px 6px;
}
.am-row{text-align:center; margin-top:10px; font-size:14px; color:var(--ink-soft);}
.am-divider{border-top:1px dashed rgba(185,117,88,0.35); margin:16px 0;}
.am-yiji{display:flex; gap:14px;}
.am-yi,.am-ji{flex:1;}
.am-tag{
  display:inline-block; font-size:13px; font-weight:700; color:#fff; border-radius:8px; padding:3px 12px; margin-bottom:8px;
}
.am-tag-yi{background:var(--mint-deep);}
.am-tag-ji{background:var(--red);}
.am-list{display:flex; flex-wrap:wrap; gap:6px;}
.am-chip{font-size:12.5px; padding:4px 10px; border-radius:999px; background:rgba(0,0,0,0.045); border:1px solid var(--line); color:var(--ink);}
.am-footer{text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:18px;}
.row-icon svg, .img-picker svg{width:20px; height:20px; color:var(--pink-deep);}
.row-icon svg{width:19px; height:19px;}
.add-form{display:flex; flex-direction:column; gap:8px; background:#fff; border-radius:18px; padding:14px 16px; box-shadow:var(--shadow-sm); margin-bottom:16px;}
.add-form .row{display:flex; gap:8px;}
.add-form input{border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font-size:15.5px; font-family:inherit; flex:1; min-width:0;}
.add-form button{border:none; background:var(--pink); color:#fff; border-radius:12px; padding:10px 16px; font-weight:700; font-size:14px;}
.search-bar{display:flex; gap:8px; margin-bottom:14px;}
.search-bar input{flex:1; border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; font-size:15.5px; font-family:inherit;}

/* ---------- bottom nav ---------- */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto;
  background:var(--paper); box-shadow:0 -4px 18px rgba(74,63,85,0.10);
  display:flex; justify-content:space-around; padding:10px 4px 14px; border-radius:22px 22px 0 0;
}
.nav-btn{background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--ink-soft); font-family:inherit;}
.nav-btn.active{color:var(--pink-deep);}
.nav-btn .ic{font-size:20px;}
.nav-btn span{font-size:10.5px;}

.section-title{font-size:16px; font-weight:700; margin:14px 0 10px;}
::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app">

  <!-- ================= 首頁 ================= -->
  <section class="screen active" id="screen-home">
    <div class="topbar">
      <div>
        <h1 class="title-font">🏠 我的數位小屋</h1>
        <div class="sub" id="home-greet">今天也要開心一天 ✨</div>
      </div>
    </div>

    <div class="hero">
      <div class="hero-ring"><span></span><span></span><span></span></div>
      <div class="hero-top">
        <div>
          <div class="hero-date-big" id="hero-day"></div>
          <div class="hero-date-sub" id="hero-ym"></div>
        </div>
        <div class="hero-lunar">
          <div class="big" id="hero-lunar-main"></div>
          <div id="hero-lunar-gz"></div>
        </div>
      </div>
      <div id="hero-festival-wrap"></div>

      <div class="hero-todo-title">
        <h3>☀️ 今天待完成</h3>
        <span class="count" id="home-todo-count"></span>
      </div>
      <div class="todo-quick-add">
        <input type="text" id="home-todo-input" placeholder="輸入待辦事項…">
        <button onclick="quickAddTodo()">＋</button>
      </div>
      <div class="todo-list" id="home-todo-list"></div>
    </div>

    <div class="grid-title">快速入口</div>
    <div class="app-grid">
      <div class="app-icon-wrap"><button class="app-icon" onclick="go('calendar')"><span class="ic ic-cal" id="homeicon-cal">📅</span><span>月曆</span></button><button class="ic-edit-btn" onclick="event.stopPropagation();openHomeIconPicker('cal')">✎</button></div>
      <div class="app-icon-wrap"><button class="app-icon" onclick="go('calculator')"><span class="ic ic-calc" id="homeicon-calc">🧮</span><span>計算機</span></button><button class="ic-edit-btn" onclick="event.stopPropagation();openHomeIconPicker('calc')">✎</button></div>
      <div class="app-icon-wrap"><button class="app-icon" onclick="openPortal('kids')"><span class="ic ic-kid" id="homeicon-kids">👦</span><span>孩子學習</span></button><button class="ic-edit-btn" onclick="event.stopPropagation();openHomeIconPicker('kids')">✎</button></div>
      <div class="app-icon-wrap"><button class="app-icon" onclick="openPortal('me')"><span class="ic ic-me" id="homeicon-me">👩</span><span>我的資料</span></button><button class="ic-edit-btn" onclick="event.stopPropagation();openHomeIconPicker('me')">✎</button></div>
      <div class="app-icon-wrap"><button class="app-icon" onclick="openPortal('life')"><span class="ic ic-life" id="homeicon-life">🏡</span><span>生活工具</span></button><button class="ic-edit-btn" onclick="event.stopPropagation();openHomeIconPicker('life')">✎</button></div>
      <div class="app-icon-wrap"><button class="app-icon" onclick="openPortal('fav')"><span class="ic ic-fav" id="homeicon-fav">⭐</span><span>收藏</span></button><button class="ic-edit-btn" onclick="event.stopPropagation();openHomeIconPicker('fav')">✎</button></div>

const GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

const CN_DAY_PREFIX=['初','十','廿','卅'];
const CN_MONTH=['正','二','三','四','五','六','七','八','九','十','冬','臘'];
const SOLAR_TERM_NAMES=['小寒','大寒','立春','雨水','驚蟄','春分','清明','穀雨','立夏','小滿','芒種','夏至','小暑','大暑','立秋','處暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];

function lunarLeapMonth(y){ return LUNAR_INFO[y-1900] & 0xf; }
function lunarLeapDays(y){ return lunarLeapMonth(y) ? ((LUNAR_INFO[y-1900] & 0x10000)?30:29) : 0; }
function lunarMonthDays(y,m){ return (LUNAR_INFO[y-1900] & (0x10000>>m)) ? 30 : 29; }
function lunarYearDays(y){
  let sum=348;
  for(let i=0x8000;i>0x8;i>>=1){ sum += (LUNAR_INFO[y-1900]&i)?1:0; }
  return sum + lunarLeapDays(y);
}
function toChinaMonth(m){ return CN_MONTH[m-1]+'月'; }
function toChinaDay(d){
  if(d===10) return '初十';
  if(d===20) return '二十';
  if(d===30) return '三十';
  return CN_DAY_PREFIX[Math.floor(d/10)] + CN_NUM[d%10];
}
function getTerm(y,n){
  if(y<1900||y>2100) return -1;
  const table=STERM_INFO[y-1900];
  const info=[0,1,2,3,4,5].map(i=>parseInt('0x'+table.substr(i*5,5)).toString());
  const cal=[];
  info.forEach(v=>{ cal.push(v.substr(0,1),v.substr(1,2),v.substr(3,1),v.substr(4,2)); });
  return parseInt(cal[n-1]);
}
// 公曆 -> 農曆
function solar2lunar(y,m,d){
  if(y<1900||y>2100) return null;
  const objDate=new Date(y,m-1,d);
  const yy=objDate.getFullYear(), mm=objDate.getMonth()+1, dd=objDate.getDate();
  let offset=Math.round((Date.UTC(yy,mm-1,dd)-Date.UTC(1900,0,31))/86400000);
  let i, temp=0;
  for(i=1900;i<2101 && offset>0;i++){ temp=lunarYearDays(i); offset-=temp; }
  if(offset<0){ offset+=temp; i--; }
  const lYear=i;
  const leap=lunarLeapMonth(lYear);
  let isLeap=false;
  for(i=1;i<13 && offset>0;i++){
    if(leap>0 && i===leap+1 && !isLeap){ i--; isLeap=true; temp=lunarLeapDays(lYear); }
    else{ temp=lunarMonthDays(lYear,i); }
    if(isLeap && i===leap+1){ isLeap=false; }
    offset-=temp;
  }
  if(offset===0 && leap>0 && i===leap+1){
    if(isLeap){ isLeap=false; } else { isLeap=true; i--; }
  }
  if(offset<0){ offset+=temp; i--; }
  const lMonth=i, lDay=offset+1;
  const gzYear=(()=>{ let g=(lYear-3)%10, z=(lYear-3)%12; if(g===0)g=10; if(z===0)z=12; return GAN[g-1]+ZHI[z-1]; })();
  const firstNode=getTerm(yy,mm*2-1);
  let term=null;
  if(dd===firstNode) term=SOLAR_TERM_NAMES[mm*2-2];
  const secondNode=getTerm(yy,mm*2);
  if(dd===secondNode) term=SOLAR_TERM_NAMES[mm*2-1];
  return { lYear, lMonth, lDay, isLeap, IMonthCn:(isLeap?'閏':'')+toChinaMonth(lMonth), IDayCn:toChinaDay(lDay),
           gzYear, animal:ANIMALS[(lYear-4)%12], term };
}
// 農曆 -> 公曆（用於找出某年 正月初一／五月初五／八月十五 等日期）
function lunar2solar(y,m,d,isLeapMonth){
  isLeapMonth=!!isLeapMonth;
  const leapMonth=lunarLeapMonth(y);
  if(isLeapMonth && leapMonth!==m) return null;
  let offset=0;
  for(let i=1900;i<y;i++){ offset+=lunarYearDays(i); }
  let leap=0, isAdd=false;
  for(let i=1;i<m;i++){
    leap=lunarLeapMonth(y);
    if(!isAdd && leap<=i && leap>0){ offset+=lunarLeapDays(y); isAdd=true; }
    offset+=lunarMonthDays(y,i);
  }
  if(isLeapMonth){ offset+=lunarMonthDays(y,m); }
  const stmap=Date.UTC(1900,1,30,0,0,0);
  const dateObj=new Date((offset+d-31)*86400000 + stmap);
  return {y:dateObj.getUTCFullYear(), m:dateObj.getUTCMonth()+1, d:dateObj.getUTCDate()};
}

function addDays(y,m,d,n){ const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return {y:dt.getFullYear(), m:dt.getMonth()+1, d:dt.getDate()}; }

// 依年份動態計算「國定假日／民俗節日」對照表，回傳 { 'YYYY-MM-DD': [{name,emoji,type}] }
const holidayCache={};
function getHolidayMap(year){
  if(holidayCache[year]) return holidayCache[year];
  const map={};
  function push(y,m,d,name,emoji,type){
    const k=dateKey(y,m,d);
    if(!map[k]) map[k]=[];
    map[k].push({name,emoji,type});
  }
  // 固定國曆日期的國定假日 + 自動補假（六提前補、日順延補）
  FIXED_HOLIDAYS.forEach(h=>{
    push(year,h.m,h.d,h.name,h.emoji,'national');
    const wd=weekdayOf(year,h.m,h.d);
    if(wd===6){ const p=addDays(year,h.m,h.d,-1); push(p.y,p.m,p.d,h.name+'補假',h.emoji,'makeup'); }
    if(wd===0){ const p=addDays(year,h.m,h.d,1); push(p.y,p.m,p.d,h.name+'補假',h.emoji,'makeup'); }
  });
  // 農曆新年：小年夜、除夕、初一～初三（政府公告之春節連假，5 天）
  const cny=lunar2solar(year,1,1,false);
  if(cny){
    const eveMinus1=addDays(cny.y,cny.m,cny.d,-2); // 小年夜
    const eve=addDays(cny.y,cny.m,cny.d,-1);       // 除夕
    push(eveMinus1.y,eveMinus1.m,eveMinus1.d,'小年夜','🧧','national');
    push(eve.y,eve.m,eve.d,'除夕','🧧','national');
    push(cny.y,cny.m,cny.d,'春節（初一）','🧧','national');
    ['二','三'].forEach((label,idx)=>{ const p=addDays(cny.y,cny.m,cny.d,idx+1); push(p.y,p.m,p.d,'春節（初'+label+'）','🧧','national'); });
  }
  // 元宵節 正月十五
  const lantern=lunar2solar(year,1,15,false);
  if(lantern) push(lantern.y,lantern.m,lantern.d,'元宵節','🏮','folk');
  // 端午節 五月初五（國定假日）+ 自動補假
  const dragonboat=lunar2solar(year,5,5,false);
  if(dragonboat){
    push(dragonboat.y,dragonboat.m,dragonboat.d,'端午節','🐉','national');
    const wd=weekdayOf(dragonboat.y,dragonboat.m,dragonboat.d);
    if(wd===6){ const p=addDays(dragonboat.y,dragonboat.m,dragonboat.d,-1); push(p.y,p.m,p.d,'端午節補假','🐉','makeup'); }
    if(wd===0){ const p=addDays(dragonboat.y,dragonboat.m,dragonboat.d,1); push(p.y,p.m,p.d,'端午節補假','🐉','makeup'); }
  }
  // 七夕 七月初七
  const qixi=lunar2solar(year,7,7,false);
  if(qixi) push(qixi.y,qixi.m,qixi.d,'七夕','💕','folk');
  // 中元節 七月十五
  const zhongyuan=lunar2solar(year,7,15,false);
  if(zhongyuan) push(zhongyuan.y,zhongyuan.m,zhongyuan.d,'中元節','🏮','folk');
  // 中秋節 八月十五（國定假日）+ 自動補假
  const midautumn=lunar2solar(year,8,15,false);
  if(midautumn){
    push(midautumn.y,midautumn.m,midautumn.d,'中秋節','🥮','national');
    const wd=weekdayOf(midautumn.y,midautumn.m,midautumn.d);
    if(wd===6){ const p=addDays(midautumn.y,midautumn.m,midautumn.d,-1); push(p.y,p.m,p.d,'中秋節補假','🥮','makeup'); }
    if(wd===0){ const p=addDays(midautumn.y,midautumn.m,midautumn.d,1); push(p.y,p.m,p.d,'中秋節補假','🥮','makeup'); }
  }
  // 重陽節 九月初九
  const chongyang=lunar2solar(year,9,9,false);
  if(chongyang) push(chongyang.y,chongyang.m,chongyang.d,'重陽節','🌼','folk');
  holidayCache[year]=map;
  return map;
}
function getFestivalsFor(y,m,d){
  const map=getHolidayMap(y);
  return map[dateKey(y,m,d)] || [];
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const maxSize=120;
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; } }
        else{ if(h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; } }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.72));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
async function handleImgSelect(e){
  const file=e.target.files[0];
  if(!file) return;
  const dataUrl=await compressImage(file);
  state_img.pendingImg=dataUrl;
  document.getElementById('img-picker-btn').innerHTML=`<img src="${dataUrl}">`;
}

function renderAlmanac(){
  const now=state.today;
  const y=now.getFullYear(), m=now.getMonth()+1, d=now.getDate();
  const weekNames=['日','一','二','三','四','五','六'];
  const lunar=solar2lunar(y,m,d);
  const dGZ=dayGanZhiIdx(y,m,d);
  const yGanIdx=(lunar.lYear-4+1000)%10;
  const mGZ=monthGanZhi(yGanIdx, lunar.lMonth);
  const jianchuIdx=(dGZ.zhi-mGZ.zhi+12)%12;
  const jc=JIANCHU[jianchuIdx];
  const pairIdx=(()=>{ for(let n=0;n<60;n++){ if(n%10===dGZ.gan && n%12===dGZ.zhi) return Math.floor(n/2); } return 0; })();
  const nayin=NAYIN[pairIdx];
  const conflictZhi=(dGZ.zhi+6)%12;

  document.getElementById('am-lunar-big').textContent=`${lunar.IMonthCn}${lunar.IDayCn}`;
  document.getElementById('am-solar').textContent=`${y}年${m}月${d}日・星期${weekNames[now.getDay()]}`;
  document.getElementById('am-ganzhi').textContent=`${lunar.gzYear}年（${lunar.animal}年） ${ganZhiName(mGZ.gan,mGZ.zhi)}月 ${ganZhiName(dGZ.gan,dGZ.zhi)}日`;
  document.getElementById('am-conflict').innerHTML=`沖 <b>${ANIMALS[conflictZhi]}</b>　五行：<b>${nayin}</b>　今日值日：<b>${jc}</b>`;
  renderTagList('am-yi-list', JIANCHU_YI[jc]);
  renderTagList('am-ji-list', JIANCHU_JI[jc]);
}
function renderTagList(elId, text){
  const items=text.split('、');
  document.getElementById(elId).innerHTML=items.map(t=>`<span class="am-chip">${t}</span>`).join('');
}

/* ---------------- 音效（Web Audio 即時合成，不需外部音檔） ---------------- */
let audioCtx=null;
function getAudioCtx(){
  if(!audioCtx){ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
  if(audioCtx.state==='suspended'){ audioCtx.resume(); }
  return audioCtx;
}
function playTone(freq,dur,type,vol){
  try{
    const ctx=getAudioCtx();
    const osc=ctx.createOscillator(); const gain=ctx.createGain();
    osc.type=type||'sine'; osc.frequency.value=freq;
    gain.gain.setValueAtTime(vol||0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+dur);
  }catch(e){}
}
function playClick(){ playTone(680,0.07,'sine',0.10); }
function playNoiseBurst(dur,vol,filterFreq){
  try{
    const ctx=getAudioCtx();
    const bufferSize=ctx.sampleRate*dur;
    const buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i]=(Math.random()*2-1)*(1-i/bufferSize); }
    const src=ctx.createBufferSource(); src.buffer=buffer;
    const filter=ctx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=filterFreq||1200;
    const gain=ctx.createGain(); gain.gain.value=vol||0.2;
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    src.start();
  }catch(e){}
}
function playShakeSound(){
  let n=0;
  const iv=setInterval(()=>{ playNoiseBurst(0.06,0.18,1800+Math.random()*800); n++; if(n>10) clearInterval(iv); }, 80);
}
function playTossSound(){
  playNoiseBurst(0.18,0.3,300);
  setTimeout(()=>playNoiseBurst(0.18,0.28,260), 220);
}
function playChime(){ playTone(880,0.18,'sine',0.14); setTimeout(()=>playTone(1180,0.22,'sine',0.12),110); }
function playSoftNo(){ playTone(320,0.25,'sine',0.12); }
// 讓每個按鈕點擊都有回饋音
document.addEventListener('click', (e)=>{
  const btn=e.target.closest('button');
  if(btn) playClick();
}, true);

function setQianImages(){
  document.getElementById('qian-mini-tube-img').src=IMG_QIAN_TUBE;
  document.getElementById('qian-tube-big').src=IMG_QIAN_TUBE;
  document.getElementById('jiao1').src=IMG_JIAO_ROUND;
  document.getElementById('jiao2').src=IMG_JIAO_ROUND;
}
setQianImages();
function numberToChinese(n){
  const d=['','一','二','三','四','五','六','七','八','九'];
  if(n<=10){ return n===10?'十':d[n]; }
  const tens=Math.floor(n/10), ones=n%10;
  let s=tens===1?'十':d[tens]+'十';
  if(ones>0) s+=d[ones];
  return s;
}
let currentQian=null;
function openQianModal(){
  document.getElementById('qian-modal').classList.add('show');
  document.getElementById('qian-stage-idle').classList.remove('hidden');
  document.getElementById('qian-stage-confirm').classList.add('hidden');
  document.getElementById('qian-stage-result').classList.add('hidden');
  currentQian=null;
  const tube=document.getElementById('qian-tube-big');
  tube.style.animation='none'; void tube.offsetWidth; tube.style.animation='';
}
function closeQianModal(){
  document.getElementById('qian-modal').classList.remove('show');
}
function shakeQian(){
  const tube=document.getElementById('qian-tube-big');
  if(tube.classList.contains('shaking')) return;
  tube.classList.add('shaking');
  playShakeSound();
  setTimeout(()=>{
    tube.classList.remove('shaking');
    currentQian=QIAN_DATA[Math.floor(Math.random()*QIAN_DATA.length)];
    document.getElementById('qian-num').textContent=numberToChinese(currentQian.n);
    document.getElementById('jiao-result').innerHTML='&nbsp;';
    resetJiaoBlocks();
    document.getElementById('qian-stage-idle').classList.add('hidden');
    document.getElementById('qian-stage-confirm').classList.remove('hidden');
  }, 900);
}
function resetJiaoBlocks(){
  const j1=document.getElementById('jiao1'), j2=document.getElementById('jiao2');
  j1.className='jiao-block'; j2.className='jiao-block';
  j1.src=IMG_JIAO_ROUND; j2.src=IMG_JIAO_ROUND;
}
function throwJiao(){
  const j1=document.getElementById('jiao1'), j2=document.getElementById('jiao2');
  const btn=document.getElementById('jiao-btn');
  btn.disabled=true;
  playTossSound();
  j1.classList.add('tossing'); j2.classList.add('tossing');

  const face2=Math.random()<0.5?'round':'flat';
  setTimeout(()=>{
    j1.className='jiao-block'; j2.className='jiao-block';
    j1.src=face1==='round'?IMG_JIAO_ROUND:IMG_JIAO_FLAT;
    j2.src=face2==='round'?IMG_JIAO_ROUND:IMG_JIAO_FLAT;
    const resultEl=document.getElementById('jiao-result');
    btn.disabled=false;
    if(face1!==face2){
      resultEl.textContent='🙏 聖筊！這支籤就是要給你的';
      playChime();
      setTimeout(()=>renderQianResult(currentQian), 700);
    }else if(face1==='round'){
      resultEl.textContent='😅 笑筊，神明說再想清楚一點，重新擲筊';
      playSoftNo();
    }else{
      resultEl.textContent='🙅 陰筊，不是這支，換一支籤再問一次';
      playSoftNo();
      setTimeout(()=>{
        document.getElementById('qian-stage-confirm').classList.add('hidden');
        document.getElementById('qian-stage-idle').classList.remove('hidden');
      }, 1200);
    }
  }, 900);
}
function renderQianResult(item){

  document.getElementById('qr-n').textContent=numberToChinese(item.n);

async function renderTodoList(containerId, dKey, countId){
  const key='todo:'+dKey;

  if(!list.length){
    container.innerHTML='<div class="empty-hint">今天還沒有待辦事項，新增一個吧！🌱</div>';

async function toggleTodo(dKey,id){
  const key='todo:'+dKey;
  const list=(await storeGet(key)) || [];
  const item=list.find(t=>t.id===id);
  if(item) item.done=!item.done;
  await storeSet(key,list);
  refreshTodoViews(dKey);
}
async function deleteTodo(dKey,id){
  const key='todo:'+dKey;
  let list=(await storeGet(key)) || [];
  list=list.filter(t=>t.id!==id);
  await storeSet(key,list);
  refreshTodoViews(dKey);
}
function refreshTodoViews(dKey){
  const d=state.today;
  const homeKey=dateKey(d.getFullYear(),d.getMonth()+1,d.getDate());
  if(dKey===homeKey) renderTodoList('home-todo-list',dKey,'home-todo-count');
  if(state.selectedDate===dKey) renderTodoList('dm-todo-list',dKey,'dm-todo-count');
  renderCalendarDayMarkers();
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- 月曆 ---------------- */
function changeMonth(delta){
  state.calMonth+=delta;
  if(state.calMonth>12){ state.calMonth=1; state.calYear++; }
  if(state.calMonth<1){ state.calMonth=12; state.calYear--; }
  renderCalendar();
}
async function renderCalendar(){
  const y=state.calYear, m=state.calMonth;
  document.getElementById('cal-title').textContent=`${y}年${m}月`;
  const firstWeekday=new Date(y,m-1,1).getDay();
  const daysInMonth=new Date(y,m,0).getDate();
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  for(let i=0;i<firstWeekday;i++){
    grid.innerHTML+='<div class="day-cell pad"></div>';
  }
  const todayKey=dateKey(state.today.getFullYear(),state.today.getMonth()+1,state.today.getDate());
  for(let day=1; day<=daysInMonth; day++){
    const lunar=solar2lunar(y,m,day);
    const isRed = lunar.lDay===1 || lunar.lDay===15;
    const fests=getFestivalsFor(y,m,day);
    const k=dateKey(y,m,day);
    const isToday = k===todayKey;
    const lunarLabel = lunar.term ? lunar.term : (lunar.lDay===1? lunar.IMonthCn : lunar.IDayCn);
    grid.innerHTML+=`<div class="day-cell ${isRed?'red':''} ${isToday?'today':''}" data-key="${k}" onclick="openDayModal('${k}')">
      <div class="sd">${day}</div>
      <div class="ld">${lunarLabel}</div>
      ${fests.length? `<div class="fest">${fests[0].emoji}</div>`:''}
    </div>`;
  }
  await renderCalendarDayMarkers();
}
async function renderCalendarDayMarkers(){
  const y=state.calYear, m=state.calMonth;
  const keys=await storeListPrefix('todo:'+y+'-'+String(m).padStart(2,'0'));
  const withTodo=new Set();
  for(const k of keys){
    const list=await storeGet(k);
    if(list && list.length) withTodo.add(k.replace('todo:',''));
  }
  document.querySelectorAll('#cal-grid .day-cell').forEach(cell=>{
    const k=cell.getAttribute('data-key');
    cell.classList.toggle('has-todo', k && withTodo.has(k));
  });
}
async function openDayModal(k){
  state.selectedDate=k;

    (fests.length? '<br>'+fests.map(f=>`${f.emoji} ${f.name}${f.type==='national'||f.type==='makeup'?'（放假）':''}`).join('　') : '');

/* ---------------- 計算機 ---------------- */
const calc={acc:null, op:null, cur:'0', fresh:true};
function calcRefresh(){
  document.getElementById('calc-value').textContent=calc.cur;
  document.getElementById('calc-expr').textContent = calc.acc!==null ? `${trimNum(calc.acc)} ${calc.op||''}` : '\u00a0';
}
function trimNum(n){
  n=Math.round(n*1e10)/1e10;
  return n.toString();
}
function calcNum(n){
  if(calc.fresh || calc.cur==='0'){ calc.cur=n; calc.fresh=false; }
  else{ calc.cur+=n; }
  calcRefresh();
}
function calcDot(){
  if(calc.fresh){ calc.cur='0.'; calc.fresh=false; return calcRefresh(); }
  if(!calc.cur.includes('.')) calc.cur+='.';
  calcRefresh();
}
function calcClear(){ calc.acc=null; calc.op=null; calc.cur='0'; calc.fresh=true; calcRefresh(); }
function calcBackspace(){
  if(calc.fresh) return;
  calc.cur = calc.cur.length>1 ? calc.cur.slice(0,-1) : '0';
  calcRefresh();
}
function calcPercent(){ calc.cur=trimNum(parseFloat(calc.cur)/100); calcRefresh(); }
function applyOp(a,op,b){
  switch(op){ case '＋': return a+b; case '－': return a-b; case '×': return a*b; case '÷': return b===0?NaN:a/b; }
  return b;
}
function calcOp(op){
  const val=parseFloat(calc.cur);
  if(calc.acc!==null && calc.op && !calc.fresh){
    calc.acc=applyOp(calc.acc, calc.op, val);
    calc.cur=trimNum(calc.acc);
  }else{
    calc.acc=val;
  }
  calc.op=op;
  calc.fresh=true;
  calcRefresh();
}
function calcEquals(){
  if(calc.op===null) return;
  const val=parseFloat(calc.cur);
  calc.acc=applyOp(calc.acc===null?val:calc.acc, calc.op, val);
  calc.cur=trimNum(calc.acc);
  calc.op=null; calc.acc=null; calc.fresh=true;
  calcRefresh();
}

async function renderPortalList(){
  const key='portal:'+state.currentPortal;
  const items=(await storeGet(key)) || [];
  const list=document.getElementById('portal-list');
  if(!items.length){
    list.innerHTML='<div class="empty-hint">這裡還是空的，新增第一筆內容吧！</div>';
    return;
  }
  const isPhone = state.currentPortal==='phone';
  list.innerHTML=items.map(it=>{
    const iconHtml = it.img ? `<img src="${it.img}">` : (it.emoji||'🙂');
    const sub = isPhone ? (it.phone||'') : (it.url||'');
    const clickAction = isPhone
      ? (it.phone ? `window.location.href='tel:${escapeAttr(it.phone)}'` : '')
      : `openPortalLink(event,'${escapeAttr(it.url||'')}')`;
    return `<div class="list-row" onclick="${clickAction}">
      <div class="row-icon ${it.img?'has-photo':''}">${iconHtml}</div>
      <div class="row-text"><div class="row-title">${escapeHtml(it.name)}</div>${sub?`<div class="row-sub">${escapeHtml(sub)}</div>`:''}${it.note?`<div class="row-note">${escapeHtml(it.note)}</div>`:''}</div>
      <button class="row-del" onclick="event.stopPropagation();deletePortalItem('${it.id}')">✕</button>
    </div>`;
  }).join('');
}
function escapeAttr(s){ return s.replace(/'/g,'&#39;'); }
function openPortalLink(e,url){

}
async function addPortalItem(){

/* ---------------- 搜尋 ---------------- */
async function doSearch(){
  const q=document.getElementById('search-input').value.trim().toLowerCase();
  const resultsEl=document.getElementById('search-results');
  if(!q){ resultsEl.innerHTML=''; return; }
  let html='';
  for(const key of ['kids','me','life','fav','phone']){
    const items=(await storeGet('portal:'+key)) || [];
    items.filter(it=>it.name.toLowerCase().includes(q)).forEach(it=>{
      const iconHtml = it.img ? `<img src="${it.img}">` : (it.emoji||'🙂');
      html+=`<div class="list-row" onclick="openPortalLink(event,'${escapeAttr(it.url||'')}')">
        <div class="row-icon">${iconHtml}</div>
        <div class="row-text"><div class="row-title">${escapeHtml(it.name)}</div><div class="row-sub">${PORTAL_META[key].title}</div></div>
      </div>`;
    });
  }
  const todoKeys=await storeListPrefix('todo:');

  for(const k of todoKeys){
    const list=(await storeGet(k))||[];
    list.filter(t=>t.text.toLowerCase().includes(q)).forEach(t=>{
      html+=`<div class="list-row"><div class="row-icon">${t.done?'✅':'📝'}</div>
        <div class="row-text"><div class="row-title">${escapeHtml(t.text)}</div><div class="row-sub">${k.replace('todo:','')}</div></div></div>`;
    });
  }
  resultsEl.innerHTML = html ? `<div class="list-card">${html}</div>` : '<div class="empty-hint">沒有找到符合的內容</div>';
}
